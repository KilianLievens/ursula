[project]
name = "ursula"
version = "0.1.0"
description = "Typewriter for 7.5inch eink display."
authors = [
    {name = "Kilian Lievens",email = "Kilian.Lievens@telenet.be"}
]
readme = "README.md"
requires-python = ">3.11"
dependencies = [
    "keyboard (>=0.13.5,<0.14.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "gpiozero (>=2.0.1,<3.0.0)",
    "lgpio (>=0.2.2.0)",
    "spidev (>=3.7,<4.0)"
]

[tool.poetry.scripts]
start = "ursula.test:test"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"

